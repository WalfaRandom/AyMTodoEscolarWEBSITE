<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="bstyles.css" />
  </head>
  <body>
    <main>      

      <div class="container bg-secondary">
        <h2>Filas y columnas</h2>
        <div class="row">
          <h2>Col 6 - 2 divisiones</h2>
          <p class="col-6 bg-primary text-white text-center">Parte 1-2</p>
          <p class="col-6 bg-warning text-black text-center">Parte 2-2</p>

          <h2>Col 4 - 3 divisiones</h2>
          <p class="col-4 bg-success text-white text-center">Parte 1-3</p>
          <p class="col-4 bg-warning text-black text-center">Parte 2-3</p>
          <p class="col-4 bg-danger text-white text-center">Parte 3-3</p>

          <h2 class="mt-5 ms-5">Col 3 - 4 divisiones</h2>
          <p class="col-3 bg-success text-white text-center">Parte 1-4</p>
          <p class="col-3 bg-warning text-black text-center">Parte 2-4</p>
          <p class="col-3 bg-danger text-white text-center">Parte 3-4</p>
          <p class="col-3 bg-info text-black text-center">Parte 4-4</p>
        </div>
      </div>
      <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <h2>Col auto</h2>
                <p class="bg-primary text-white text-center">Parte 1</p>    
            </div>
           <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <h2>Col auto</h2>
                <p class="bg-primary text-white text-center">Parte 2</p>    
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <h2>Col auto</h2>
                <p class="bg-primary text-white text-center">Parte 3</p>    
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <h2>Col auto</h2>
                <p class="bg-primary text-white text-center">Parte 4</p>    
            </div>
        </div>

      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
