{% extends "inventario/base.html" %}
{% block title %}{% if object %}Editar categoría{% else %}Nueva categoría{% endif %}{% endblock %}
{% block content %}
<h2>{% if object %}Editar categoría{% else %}Nueva categoría{% endif %}</h2>
<form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a href="{% url 'categoria_list' %}" class="btn btn-link">Cancelar</a>
    </div>
</form>
{% endblock %}
